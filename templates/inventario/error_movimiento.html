<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Movimiento no realizado</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0;display:grid;place-items:center;min-height:100vh}
    .card{background:white;border:1px solid #dfe6ef;border-radius:16px;padding:28px;max-width:520px;box-shadow:0 14px 40px #0001}
    h1{font-size:22px;margin-top:0}p{color:#667085}.btn{display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:10px 14px;border-radius:8px}
  </style>
</head>
<body>
  <div class="card">
    <h1>No se realizó el movimiento</h1>
    <p>{{ mensaje }}</p>
    <a class="btn" href="/?piso={{ piso_id }}">Volver al mapa</a>
  </div>
</body>
</html>
